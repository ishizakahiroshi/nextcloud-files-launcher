name: secrets-scan

# Public CI uses structural checks; private watchlists stay on the developer's machine.
on:
  push:
    branches: [main, develop, 'hotfix/**', 'release/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  scan:
    name: scan tracked files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check agent guidance
        run: node scripts/check-claude-md.mjs
      - name: Scan tracked files
        run: node scripts/secrets-scan.mjs --all-tracked --block
